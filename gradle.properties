# Gradle build properties (single-owner file: only P1 may modify).
# NOTE: .properties files are read as ISO-8859-1 by the JVM, so this file is
# kept pure ASCII on purpose -- non-ASCII text here shows up as mojibake.

# AndroidX
android.useAndroidX=true
# Non-transitive R class: smaller R class, faster incremental builds
android.nonTransitiveRClass=true
# Disable unused build features (BuildConfig is enabled explicitly by :app)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# Build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# Kotlin
kotlin.code.style=official
