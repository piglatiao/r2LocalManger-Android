[versions]
agp = "8.2.2"
kotlin = "1.9.24"
coreKtx = "1.12.0"
appcompat = "1.6.1"
material = "1.11.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
swiperefresh = "1.1.0"
viewpager2 = "1.0.0"
fragment = "1.6.2"
activity = "1.8.2"
lifecycle = "2.7.0"
navigation = "2.7.7"
biometric = "1.1.0"
documentfile = "1.0.1"
coroutines = "1.7.3"
okhttp = "4.12.0"
junit = "4.13.2"
androidxJunit = "1.1.5"
androidxTestCore = "1.5.0"
espresso = "3.5.1"

[libraries]
androidx-core-ktx        = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat       = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material                 = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout= { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview    = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefresh    = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefresh" }
androidx-viewpager2      = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-fragment-ktx    = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-activity-ktx    = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime-ktx  = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx= { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx= { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx      = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-biometric       = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-documentfile    = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp                   = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging           = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
junit                    = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit  = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-core       = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
okhttp-mockwebserver     = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-test  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
